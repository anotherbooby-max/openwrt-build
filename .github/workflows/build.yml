name: Build OpenWrt R22.3.13 x86_64 WiFi5100

on:
  workflow_dispatch:

env:

  SOURCE_REPO: https://github.com/coolsnowwolf/lede.git

  # 固定版本
  SOURCE_COMMIT: 9f26e6205

  TARGET: x86_64

  KENZO_REPO: https://github.com/kenzok8/openwrt-packages.git

  SMALL_REPO: https://github.com/kenzok8/small.git


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    - name: Checkout build config
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
        build-essential \
        clang \
        flex \
        bison \
        g++ \
        gawk \
        gcc-multilib \
        gettext \
        git \
        libncurses5-dev \
        libssl-dev \
        python3-distutils \
        rsync \
        unzip \
        zlib1g-dev \
        file



    - name: Clone LEDE source

      run: |

        set -e


        git clone \
        --depth=2000 \
        ${SOURCE_REPO} \
        lede


        cd lede


        echo "===== CURRENT ====="

        git log -1 --oneline


        echo "===== CHECKOUT R22.3.13 ====="


        git checkout ${SOURCE_COMMIT}


        echo "===== VERSION ====="

        git log -1 --oneline



    - name: Add kenzok8 packages

      run: |

        cd lede


        git clone \
        --depth=1 \
        ${KENZO_REPO} \
        package/kenzo


        git clone \
        --depth=1 \
        ${SMALL_REPO} \
        package/small



    - name: Update feeds

      run: |

        cd lede


        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Load x86_64 config

      run: |

        cd lede


        cp ../configs/x86_64.config .config


        make defconfig



    - name: Verify WiFi5100

      run: |

        cd lede


        grep -E \
        "IWLWIFI|MAC80211|WPAD|HOSTAPD" \
        .config || true



    - name: Download sources

      run: |

        cd lede


        make download -j8



    - name: Compile OpenWrt

      run: |

        cd lede


        make -j$(nproc) V=s



    - name: Collect firmware

      run: |

        mkdir firmware


        cp -rf \
        lede/bin/targets/x86/64/* \
        firmware/



    - name: Upload firmware

      uses: actions/upload-artifact@v4

      with:

        name: OpenWrt-R22.3.13-x86_64-WIFI5100

        path: firmware
