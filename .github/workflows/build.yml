```yaml
name: Build LEDE x86_64

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede.git
  LEDE_REF: 20211001
  KENZOK_REPO: https://github.com/kenzok8/openwrt-packages.git

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. 检查编译环境
      # ============================================================
      - name: Check runner
        run: |
          echo "=================================================="
          echo " GitHub Actions Build Environment"
          echo "=================================================="

          uname -a
          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

      # ============================================================
      # 2. 安装编译依赖
      # ============================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            gperf \
            haveged \
            libelf-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev \
            file \
            time

      # ============================================================
      # 3. 下载 LEDE 源码
      # ============================================================
      - name: Clone LEDE source
        run: |
          echo "=================================================="
          echo " Download LEDE source"
          echo "=================================================="

          git clone \
            --depth=1 \
            --branch "${LEDE_REF}" \
            "${LEDE_REPO}" \
            lede

          cd lede

          echo
          echo "Remote:"
          git remote -v

          echo
          echo "Current branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git log -1 --oneline

          echo
          echo "Commit date:"
          git log -1 --format='%ci'

      # ============================================================
      # 4. 验证源码
      # ============================================================
      - name: Verify LEDE source
        working-directory: lede
        run: |
          echo "=================================================="
          echo " SOURCE VERIFICATION"
          echo "=================================================="

          echo "Repository:"
          git remote get-url origin

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit short:"
          git rev-parse --short HEAD

          echo
          echo "Commit date:"
          git log -1 --format='%ci'

          echo
          echo "Commit message:"
          git log -1 --format='%s'

          echo
          echo "Makefile version information:"
          grep -E \
            '^(VERSION_NUMBER|VERSION_CODE|VERSION_REPO|VERSION_DIST|VERSION_MANUFACTURER|VERSION_MANUFACTURER_URL)' \
            include/version.mk || true

      # ============================================================
      # 5. 加入 kenzok8/openwrt-packages
      # ============================================================
      - name: Add kenzok8 packages
        working-directory: lede
        run: |
          echo "=================================================="
          echo " Add kenzok8/openwrt-packages"
          echo "=================================================="

          echo "src-git kenzok https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default

          ./scripts/feeds update -a

          ./scripts/feeds install -a

          echo
          echo "Feeds:"
          ./scripts/feeds list

      # ============================================================
      # 6. 检查 kenzok feed
      # ============================================================
      - name: Verify kenzok feed
        working-directory: lede
        run: |
          echo "=================================================="
          echo " Kenzok feed verification"
          echo "=================================================="

          ls -lah feeds/kenzok || true

          echo
          echo "SSR Plus:"
          find feeds/kenzok -maxdepth 3 \
            -type d \
            -iname '*ssr*' \
            2>/dev/null || true

      # ============================================================
      # 7. 导入 x86_64 配置
      # ============================================================
      - name: Load x86_64 configuration
        working-directory: lede
        run: |
          echo "=================================================="
          echo " Load x86_64 configuration"
          echo "=================================================="

          cp ../configs/x86_64.config .config

          echo
          echo "Initial configuration:"
          cat .config

          echo
          echo "Running defconfig..."

          make defconfig

          echo
          echo "Final configuration:"
          grep -E \
            'CONFIG_TARGET_|CONFIG_PACKAGE_(kmod-iwlwifi|iw|iwinfo|openvpn|luci-app-ssr-plus)' \
            .config || true

      # ============================================================
      # 8. 再次确认平台
      # ============================================================
      - name: Verify target
        working-directory: lede
        run: |
          echo "=================================================="
          echo " TARGET VERIFICATION"
          echo "=================================================="

          grep '^CONFIG_TARGET_x86' .config || true

          echo
          echo "Architecture:"
          grep '^CONFIG_ARCH' .config || true

          echo
          echo "Root filesystem:"
          grep '^CONFIG_TARGET_ROOTFS' .config || true

      # ============================================================
      # 9. 检查 Intel 5100 无线相关配置
      # ============================================================
      - name: Verify Intel WiFi configuration
        working-directory: lede
        run: |
          echo "=================================================="
          echo " Intel WiFi 5100 configuration"
          echo "=================================================="

          grep -E \
            'CONFIG_PACKAGE_(kmod-iwlwifi|iw|iwinfo|wireless-regdb)' \
            .config || true

          echo
          echo "Searching iwlwifi firmware packages..."

          grep -E \
            'iwlwifi.*5000|iwlwifi' \
            .config || true

      # ============================================================
      # 10. 下载源码包
      # ============================================================
      - name: Download source packages
        working-directory: lede
        run: |
          echo "=================================================="
          echo " Download source packages"
          echo "=================================================="

          make download -j$(nproc) V=s

      # ============================================================
      # 11. 编译
      # ============================================================
      - name: Build firmware
        working-directory: lede
        run: |
          echo "=================================================="
          echo " START LEDE x86_64 BUILD"
          echo "=================================================="

          echo
          echo "Source:"
          git remote get-url origin

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit short:"
          git rev-parse --short HEAD

          echo
          echo "Commit date:"
          git log -1 --format='%ci'

          echo
          echo "Build started:"
          date -u

          echo
          echo "=================================================="
          echo " Compiling..."
          echo "=================================================="

          make -j$(nproc) V=s

          echo
          echo "=================================================="
          echo " BUILD FINISHED"
          echo "=================================================="

          date -u

      # ============================================================
      # 12. 检查编译结果
      # ============================================================
      - name: Check build output
        working-directory: lede
        run: |
          echo "=================================================="
          echo " BUILD OUTPUT"
          echo "=================================================="

          echo
          echo "bin/targets:"
          find bin/targets -type f | sort

          echo
          echo "bin/packages:"
          find bin/packages -type f | sort | head -200

      # ============================================================
      # 13. 输出固件版本信息
      # ============================================================
      - name: Show firmware version
        working-directory: lede
        run: |
          echo "=================================================="
          echo " FIRMWARE VERSION INFORMATION"
          echo "=================================================="

          echo
          echo "Source repository:"
          git remote get-url origin

          echo
          echo "Source branch:"
          git branch --show-current || true

          echo
          echo "Source commit:"
          git rev-parse HEAD

          echo
          echo "Source commit short:"
          git rev-parse --short HEAD

          echo
          echo "Source commit date:"
          git log -1 --format='%ci'

          echo
          echo "OpenWrt release file:"
          if [ -f package/base-files/files/etc/openwrt_release ]; then
            cat package/base-files/files/etc/openwrt_release
          fi

          echo
          echo "Kernel configuration:"
          grep '^CONFIG_KERNEL_' .config | head -50 || true

      # ============================================================
      # 14. 保存编译配置
      # ============================================================
      - name: Save build information
        working-directory: lede
        run: |
          mkdir -p ../release

          cp .config ../release/x86_64.config

          git rev-parse HEAD > ../release/source-commit.txt

          git log -1 --format='%H%n%h%n%ci%n%s' \
            > ../release/source-info.txt

          if [ -f package/base-files/files/etc/openwrt_release ]; then
            cp package/base-files/files/etc/openwrt_release \
              ../release/openwrt_release
          fi

      # ============================================================
      # 15. 打包固件
      # ============================================================
      - name: Package firmware
        run: |
          echo "=================================================="
          echo " PACKAGE RELEASE FILES"
          echo "=================================================="

          mkdir -p release

          tar -czf \
            release/lede-x86_64-firmware.tar.gz \
            -C lede/bin targets

          tar -czf \
            release/lede-x86_64-packages.tar.gz \
            -C lede/bin packages

          echo
          echo "Release files:"
          ls -lh release

      # ============================================================
      # 16. 生成 Release 名称
      # ============================================================
      - name: Generate release information
        id: release
        working-directory: lede
        run: |
          SHORT_COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +'%Y%m%d-%H%M')

          echo "short_commit=${SHORT_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "release_tag=lede-x86_64-${DATE}-${SHORT_COMMIT}" >> "$GITHUB_OUTPUT"

          echo "Release tag:"
          echo "lede-x86_64-${DATE}-${SHORT_COMMIT}"

      # ============================================================
      # 17. 上传 GitHub Release
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: LEDE x86_64 ${{ steps.release.outputs.release_tag }}
          generate_release_notes: true
          body: |
            # LEDE x86_64

            ## 源码

            Repository:
            https://github.com/coolsnowwolf/lede

            Source ref:
            20211001

            Commit:
            ${{ steps.release.outputs.short_commit }}

            ## 平台

            - Architecture: x86_64
            - Target: x86
            - WiFi: Intel iwlwifi
            - Intel WiFi Link 5100 supported
            - mac80211
            - cfg80211
            - iw
            - iwinfo
            - wireless-regdb
            - OpenVPN
            - SSR Plus
            - kenzok8/openwrt-packages

            ## 构建

            GitHub Actions:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          files: |
            release/*
            lede/bin/targets/**/*.img
            lede/bin/targets/**/*.img.gz
            lede/bin/targets/**/*.tar.gz
            lede/bin/targets/**/*.manifest
            lede/bin/targets/**/*.json
            lede/bin/targets/**/*.sha256sums
            lede/bin/packages/**/*.ipk
            lede/bin/packages/**/*.manifest
            lede/bin/packages/**/*.index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
