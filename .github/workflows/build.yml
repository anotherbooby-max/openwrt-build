name: Build OpenWrt 18.06.9 x86_64

on:
  workflow_dispatch:


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 360


    steps:


    ########################################
    # Checkout
    ########################################

    - name: Checkout
      uses: actions/checkout@v4



    ########################################
    # Free disk
    ########################################

    - name: Free disk space
      run: |

        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/powershell

        sudo docker system prune -af

        df -h



    ########################################
    # Install dependencies
    ########################################

    - name: Install build packages

      run: |

        sudo apt update


        sudo apt install -y \
          build-essential \
          gcc \
          g++ \
          make \
          cmake \
          git \
          wget \
          curl \
          unzip \
          file \
          rsync \
          python2 \
          python2-dev \
          libncurses5-dev \
          libncursesw5-dev \
          zlib1g-dev \
          libssl-dev \
          gettext \
          xsltproc \
          binutils \
          bison \
          flex \
          patch \
          perl \
          tar \
          cpio \
          bc \
          gawk \
          subversion



    ########################################
    # Clone OpenWrt 18.06.9
    ########################################

    - name: Clone OpenWrt 18.06.9

      run: |

        git clone \
          --depth=1 \
          -b openwrt-18.06.9 \
          https://github.com/openwrt/openwrt.git \
          openwrt


        cd openwrt


        git log -1



    ########################################
    # Update feeds
    ########################################

    - name: Update feeds

      run: |

        cd openwrt


        ./scripts/feeds update -a


        ./scripts/feeds install -a



    ########################################
    # Load config
    ########################################

    - name: Load config


      run: |


        cd openwrt


        cp ../configs/x86_64.config .config


        make defconfig



        echo "========= Wireless Config ========="


        grep -E \
        "iwlwifi|iwldvm|mac80211|cfg80211|hostapd|wpad" \
        .config || true



    ########################################
    # Download source
    ########################################

    - name: Download


      run: |

        cd openwrt


        make download -j4



    ########################################
    # Compile
    ########################################

    - name: Build


      run: |

        cd openwrt


        make -j2 V=s



    ########################################
    # Check output
    ########################################


    - name: Show firmware


      run: |


        cd openwrt


        ls -lh bin/targets/x86/64/


        find bin/targets/x86/64 \
        -type f \
        \( \
        -name "*.img*" \
        -o -name "*.combined*" \
        -o -name "*.vmdk" \
        \)



    ########################################
    # Upload Artifact
    ########################################

    - name: Upload firmware


      uses: actions/upload-artifact@v4


      with:

        name: OpenWrt-18.06.9-x86_64

        path:

          openwrt/bin/targets/x86/64/



    ########################################
    # Create Release
    ########################################


    - name: Create Release


      if: success()


      uses: softprops/action-gh-release@v2


      with:


        tag_name: OpenWrt-18.06.9-${{ github.run_number }}


        name: OpenWrt 18.06.9 x86_64 Build


        files:

          openwrt/bin/targets/x86/64/*
