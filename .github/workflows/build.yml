name: Build OpenWrt R22.3.13 x86_64

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/coolsnowwolf/lede.git
  KENZO_REPO: https://github.com/kenzok8/openwrt-packages.git
  SMALL_REPO: https://github.com/kenzok8/small.git

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. Checkout build repository
      # ==========================================================
      - name: Checkout build repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Install build dependencies
      # ==========================================================
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            libnsl-dev \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

      # ==========================================================
      # 3. Clone LEDE
      # ==========================================================
      #
      # 不使用:
      #   --branch R22.3.13
      #
      # 不使用:
      #   git fetch 3516c9a
      #
      # 先完整 clone，然后根据历史版本信息定位。
      #
      # ==========================================================
      - name: Clone LEDE source
        run: |
          set -e

          echo "=============================================="
          echo "Clone LEDE source"
          echo "=============================================="

          git clone \
            --filter=blob:none \
            "${SOURCE_REPO}" \
            lede

          cd lede

          echo
          echo "===== REMOTE ====="
          git remote -v

          echo
          echo "===== CURRENT HEAD ====="
          git log -1 --oneline

          echo
          echo "===== SEARCH R22.3.13 ====="

          git fetch --unshallow

          echo
          echo "===== COMMITS AROUND 2022-03-09 ====="

          git log \
            --since="2022-03-01" \
            --until="2022-03-15" \
            --format='%H %ci %s' \
            | head -100

      # ==========================================================
      # 4. Locate R22.3.13 source
      # ==========================================================
      #
      # R22.3.13 并不是一个可以直接 clone 的 branch。
      #
      # 根据历史资料：
      #
      # LuCI:
      # git-22.068.45502-a50e601
      #
      # OpenWrt:
      # R22.3.13
      #
      # Kernel:
      # 5.4.185
      #
      # 因此这里根据历史时间范围寻找对应源码。
      #
      # ==========================================================
      - name: Locate R22.3.13 source
        run: |
          set -e

          cd lede

          echo "=============================================="
          echo "Locate R22.3.13 source"
          echo "=============================================="

          echo
          echo "===== Candidate commits ====="

          git log \
            --all \
            --since="2022-03-01" \
            --until="2022-03-15" \
            --format='%H|%ci|%s' \
            | head -200

          echo
          echo "===== Search a50e601 ====="

          git log --all --oneline --decorate \
            | grep -i "a50e601" \
            || true

          echo
          echo "===== Search R22.3.13 ====="

          git log --all --oneline --decorate \
            | grep -i "R22.3.13" \
            || true

      # ==========================================================
      # 5. Print source information
      # ==========================================================
      - name: Show source information
        run: |
          set -e

          cd lede

          echo "=============================================="
          echo "SOURCE INFORMATION"
          echo "=============================================="

          echo
          echo "HEAD:"
          git log -1 --oneline

          echo
          echo "DATE:"
          git log -1 --format='%ci'

          echo
          echo "COMMIT:"
          git rev-parse HEAD

          echo
          echo "VERSION FILES:"
          grep -R \
            "R22.3.13" \
            package \
            target \
            include \
            2>/dev/null \
            | head -30 \
            || true

      # ==========================================================
      # 6. Add kenzok8 packages
      # ==========================================================
      - name: Add kenzok8 packages
        run: |
          set -e

          cd lede

          echo "=============================================="
          echo "Add kenzok8 packages"
          echo "=============================================="

          rm -rf package/kenzo
          rm -rf package/small

          git clone \
            --depth=1 \
            "${KENZO_REPO}" \
            package/kenzo

          git clone \
            --depth=1 \
            "${SMALL_REPO}" \
            package/small

      # ==========================================================
      # 7. Update feeds
      # ==========================================================
      - name: Update feeds
        run: |
          set -e

          cd lede

          echo "=============================================="
          echo "Update feeds"
          echo "=============================================="

          ./scripts/feeds update -a

          ./scripts/feeds install -a

      # ==========================================================
      # 8. Load x86_64 configuration
      # ==========================================================
      - name: Load x86_64 config
        run: |
          set -e

          cd lede

          echo "=============================================="
          echo "Load x86_64 configuration"
          echo "=============================================="

          cp ../configs/x86_64.config .config

          echo
          echo "===== ORIGINAL CONFIG ====="
          cat .config

          echo
          echo "===== DEFCONFIG ====="

          make defconfig

          echo
          echo "===== FINAL CONFIG ====="

          grep -E \
            'CONFIG_TARGET_x86|CONFIG_PACKAGE_kmod-iwlwifi|CONFIG_PACKAGE_iwlwifi|CONFIG_PACKAGE_wpad|CONFIG_PACKAGE_hostapd|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_iw|CONFIG_PACKAGE_iwinfo|CONFIG_PACKAGE_wireless-regdb' \
            .config \
            || true

      # ==========================================================
      # 9. Check important wireless packages
      # ==========================================================
      - name: Verify wireless configuration
        run: |
          set -e

          cd lede

          echo "=============================================="
          echo "Verify wireless configuration"
          echo "=============================================="

          echo
          echo "===== TARGET ====="

          grep \
            '^CONFIG_TARGET_x86' \
            .config \
            || true

          echo
          echo "===== IWLWIFI ====="

          grep \
            'iwlwifi' \
            .config \
            || true

          echo
          echo "===== MAC80211 ====="

          grep \
            'mac80211' \
            .config \
            || true

          echo
          echo "===== WPAD / HOSTAPD ====="

          grep -E \
            'wpad|hostapd' \
            .config \
            || true

          echo
          echo "===== LUCI ====="

          grep \
            'CONFIG_PACKAGE_luci' \
            .config \
            || true

      # ==========================================================
      # 10. Download sources
      # ==========================================================
      - name: Download sources
        run: |
          set -e

          cd lede

          echo "=============================================="
          echo "Download sources"
          echo "=============================================="

          make download -j8 V=s

      # ==========================================================
      # 11. Compile
      # ==========================================================
      - name: Compile OpenWrt
        run: |
          set -e

          cd lede

          echo "=============================================="
          echo "Compile OpenWrt"
          echo "=============================================="

          make V=s -j2

      # ==========================================================
      # 12. Verify firmware
      # ==========================================================
      - name: Verify firmware
        run: |
          set -e

          cd lede

          echo "=============================================="
          echo "Firmware output"
          echo "=============================================="

          find bin/targets -type f | sort

      # ==========================================================
      # 13. Create wireless verification report
      # ==========================================================
      - name: Create build report
        run: |
          set -e

          cd lede

          mkdir -p ../build-report

          echo "OpenWrt build report" \
            > ../build-report/version.txt

          echo \
            "==============================================" \
            >> ../build-report/version.txt

          echo \
            "Git commit:" \
            >> ../build-report/version.txt

          git rev-parse HEAD \
            >> ../build-report/version.txt

          echo \
            "Git date:" \
            >> ../build-report/version.txt

          git log -1 --format='%ci' \
            >> ../build-report/version.txt

          echo \
            "==============================================" \
            >> ../build-report/version.txt

          echo \
            "Wireless packages:" \
            >> ../build-report/version.txt

          grep -E \
            'iwlwifi|mac80211|wpad|hostapd|luci|iwinfo|wireless-regdb' \
            .config \
            >> ../build-report/version.txt \
            || true

          echo
          cat ../build-report/version.txt

      # ==========================================================
      # 14. Upload firmware
      # ==========================================================
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-r22.3.13-x86_64
          path: |
            lede/bin/targets/x86/64/**
            build-report/**
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 15. Upload release
      # ==========================================================
      - name: Prepare release files
        run: |
          set -e

          mkdir -p release

          find lede/bin/targets/x86/64 \
            -maxdepth 1 \
            -type f \
            -exec cp {} release/ \;

          cp build-report/version.txt release/

          echo
          echo "===== RELEASE FILES ====="
          ls -lah release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r22.3.13-x86_64
          name: OpenWrt R22.3.13 x86_64
          body: |
            OpenWrt / LEDE x86_64 build.

            Target:
            x86/64

            Wireless:
            Intel WiFi Link 5100 AGN
            PCI ID: 8086:4232
            Driver: iwlwifi
            Firmware: iwlwifi-5000-5.ucode
            mac80211
            hostapd / wpad
            LuCI

            注意：
            Intel 5100 是否可以真正创建 AP，需要在实际硬件上通过
            `iw list` 检查 Supported interface modes 中是否存在 AP。
          files: release/*
          fail_on_unmatched_files: true
