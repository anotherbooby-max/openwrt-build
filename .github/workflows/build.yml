name: Build OpenWrt x86_64 WiFi

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 360


    steps:


    ##################################################
    # Checkout
    ##################################################

    - name: Checkout
      uses: actions/checkout@v4



    ##################################################
    # Free space
    ##################################################

    - name: Free disk
      run: |

        df -h

        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /opt/ghc || true

        sudo docker system prune -af || true

        df -h



    ##################################################
    # Dependencies
    ##################################################

    - name: Install dependencies

      run: |

        sudo apt update


        sudo apt install -y \
        build-essential \
        clang \
        flex \
        bison \
        gawk \
        gettext \
        git \
        libncurses-dev \
        libssl-dev \
        python3 \
        python3-pip \
        python3-pyelftools \
        rsync \
        unzip \
        wget \
        zstd \
        file \
        ccache



    ##################################################
    # Clone OpenWrt 25.12
    ##################################################

    - name: Clone OpenWrt

      run: |


        git clone \
        --depth=1 \
        --branch=openwrt-25.12 \
        https://github.com/openwrt/openwrt.git \
        openwrt



    ##################################################
    # Feeds
    ##################################################

    - name: Update feeds

      run: |

        cd openwrt


        ./scripts/feeds update -a

        ./scripts/feeds install -a



    ##################################################
    # Custom config
    ##################################################

    - name: Configure OpenWrt

      run: |

        cd openwrt


        cat > .config <<'EOF'


CONFIG_TARGET_x86=y
CONFIG_TARGET_x86_64=y
CONFIG_TARGET_x86_64_DEVICE_generic=y


#
# LuCI
#

CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y



#
# Wireless
#

CONFIG_PACKAGE_kmod-cfg80211=y
CONFIG_PACKAGE_kmod-mac80211=y

CONFIG_PACKAGE_kmod-iwlwifi=y


#
# Intel firmware
#

CONFIG_PACKAGE_iwlwifi-firmware-iwl5000=y


#
# Wireless tools
#

CONFIG_PACKAGE_iw=y
CONFIG_PACKAGE_iwinfo=y
CONFIG_PACKAGE_wireless-regdb=y



#
# Kernel modules
#

CONFIG_PACKAGE_kmod-usb-core=y


#
# Filesystem
#

CONFIG_TARGET_ROOTFS_EXT4FS=y


EOF



        make defconfig



        echo "===== Wireless check ====="

        grep -E \
        "iwlwifi|mac80211|cfg80211|iwinfo|wireless-regdb" \
        .config || true



    ##################################################
    # Download
    ##################################################

    - name: Download

      run: |

        cd openwrt

        make download -j4



    ##################################################
    # Build
    ##################################################

    - name: Build

      run: |

        cd openwrt


        make -j2 V=s



    ##################################################
    # Check firmware
    ##################################################

    - name: Check output

      run: |

        cd openwrt


        echo "===== Images ====="


        find bin/targets/x86/64 \
        -type f



        echo

        echo "===== Wireless packages ====="


        find bin/packages \
        | grep -E \
        "iwlwifi|mac80211|cfg80211|wireless-regdb" \
        || true



    ##################################################
    # Artifact
    ##################################################

    - name: Upload Artifact

      uses: actions/upload-artifact@v4

      with:

        name: openwrt-x86-64-wifi

        path:

          openwrt/bin/targets/x86/64/

        retention-days: 7




    ##################################################
    # Release
    ##################################################

    - name: Create Release

      if: success()

      uses: softprops/action-gh-release@v2


      with:

        tag_name: openwrt-${{ github.run_number }}

        name: OpenWrt x86_64 WiFi Build ${{ github.run_number }}


        files: |

          openwrt/bin/targets/x86/64/*

      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
