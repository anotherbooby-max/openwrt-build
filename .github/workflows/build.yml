name: Build LEDE 19.07 x86_64


on:
  workflow_dispatch:


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-20.04

    timeout-minutes: 360


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          gcc \
          g++ \
          git \
          wget \
          curl \
          unzip \
          file \
          rsync \
          python2 \
          libncurses5-dev \
          libncursesw5-dev \
          zlib1g-dev \
          libssl-dev \
          gettext \
          xsltproc \
          binutils \
          bison \
          flex \
          patch \
          perl \
          tar \
          cpio \
          bc \
          gawk



    ################################
    # Clone LEDE
    ################################

    - name: Clone LEDE


      run:

        git clone \
          --depth=1 \
          -b openwrt-19.07 \
          https://github.com/coolsnowwolf/lede.git \
          lede



    ################################
    # Add packages
    ################################


    - name: Add feeds


      run:

        cd lede


        echo 'src-git kenzo https://github.com/kenzok8/openwrt-packages.git' >> feeds.conf.default



    ################################


    - name: Update feeds


      run:

        cd lede


        ./scripts/feeds update -a

        ./scripts/feeds install -a



    ################################

    - name: Load config


      run:

        cd lede


        cp ../configs/x86_64.config .config


        make defconfig



    ################################


    - name: Download


      run:

        cd lede


        make download -j4



    ################################


    - name: Build


      run:


        cd lede


        make -j2 V=s



    ################################

    - name: Upload


      uses: actions/upload-artifact@v4


      with:

        name: lede-x86-64

        path:

          lede/bin/targets/x86/64/*



    ################################

    - name: Release


      if: success()


      uses: softprops/action-gh-release@v2


      with:


        tag_name:

          lede-19.07-${{github.run_number}}


        name:

          LEDE 19.07 x86_64


        files:

          lede/bin/targets/x86/64/*
