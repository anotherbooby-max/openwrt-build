name: Build OpenWrt x86_64 R22


on:
  workflow_dispatch:


env:

  SOURCE_REPO: https://github.com/coolsnowwolf/lede.git

  SOURCE_BRANCH: openwrt-22.03

  TARGET: x86_64



jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    - name: Checkout build config

      uses: actions/checkout@v4



    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y \
        build-essential \
        clang \
        flex \
        bison \
        g++ \
        gawk \
        gcc-multilib \
        gettext \
        git \
        libncurses5-dev \
        libssl-dev \
        python3-distutils \
        rsync \
        unzip \
        zlib1g-dev \
        file



    - name: Clone LEDE source

      run: |

        git clone \
        --branch ${SOURCE_BRANCH} \
        --depth=1 \
        ${SOURCE_REPO} \
        lede


        cd lede


        echo "===== SOURCE ====="

        git branch

        git log -1 --oneline



    - name: Add wireless config

      run: |

        cp configs/x86_64.config lede/.config



    - name: Update feeds

      run: |

        cd lede

        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Defconfig

      run: |

        cd lede

        make defconfig



    - name: Download packages

      run: |

        cd lede

        make download -j8



    - name: Compile

      run: |

        cd lede

        make -j$(nproc)



    - name: Check firmware

      run: |

        ls -lh lede/bin/targets/x86/64/



    - name: Upload firmware

      uses: actions/upload-artifact@v4

      with:

        name: openwrt-x86-64-r22-wifi5100

        path:

          lede/bin/targets/x86/64/*
