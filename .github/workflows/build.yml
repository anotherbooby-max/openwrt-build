name: Build OpenWrt x86_64 Intel5100

on:
  workflow_dispatch:

env:

  SOURCE_REPO: https://github.com/coolsnowwolf/lede.git

  # 2022年稳定版本
  SOURCE_BRANCH: master

  TARGET: x86_64


jobs:

 build:

  runs-on: ubuntu-22.04


  steps:


  - name: Checkout build repo
    uses: actions/checkout@v4


  - name: Install dependencies

    run: |

      sudo apt update

      sudo apt install -y \
        build-essential \
        clang \
        flex \
        bison \
        g++ \
        gawk \
        gettext \
        git \
        libncurses5-dev \
        libssl-dev \
        python3 \
        rsync \
        unzip \
        zstd \
        file



  - name: Clone LEDE

    run: |


      git clone \
      --depth=1 \
      ${SOURCE_REPO} \
      lede


      cd lede


      echo "===== SOURCE ====="

      git log -1 --oneline



  - name: Add wireless packages


    run: |

      cd lede


      git clone \
      https://github.com/kenzok8/openwrt-packages.git \
      package/kenzo



  - name: Update feeds


    run: |

      cd lede


      ./scripts/feeds update -a

      ./scripts/feeds install -a



  - name: Load x86 config


    run: |


      cd lede


      cp ../configs/x86_64.config .config


      make defconfig



  - name: Compile


    run: |


      cd lede


      make download -j8


      make -j$(nproc) V=s



  - name: Collect firmware


    run: |


      mkdir output


      cp lede/bin/targets/x86/64/* output/


  - name: Upload


    uses: actions/upload-artifact@v4


    with:

      name: openwrt-x86-64-intel5100

      path: output/
