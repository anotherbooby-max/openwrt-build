name: Build OpenWrt x86_64

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/coolsnowwolf/lede.git

  # 使用 LEDE 的正式 Tag
  SOURCE_TAG: R22.5.5-x64-Release

  KENZO_REPO: https://github.com/kenzok8/openwrt-packages.git
  SMALL_REPO: https://github.com/kenzok8/small.git

  TARGET: x86_64

jobs:

  build:
    name: Build LEDE x86_64
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. 检出自己的仓库
      # ==========================================================
      - name: Checkout build repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 安装编译依赖
      # ==========================================================
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar \
            java-propose-classpath \
            swig \
            time \
            ccache

      # ==========================================================
      # 3. 下载 LEDE
      #
      # 注意：
      # R22.5.5-x64-Release 是 TAG，不是 branch
      # 因此先 clone，再 checkout TAG
      # ==========================================================
      - name: Clone LEDE source
        run: |
          set -e

          echo "=============================================="
          echo "Downloading LEDE source"
          echo "=============================================="

          git clone --depth=1 \
            "${SOURCE_REPO}" \
            lede

          cd lede

          echo
          echo "===== SOURCE REMOTE ====="
          git remote -v

          echo
          echo "===== FETCH COMMIT ====="

          git fetch --depth=1 origin 3516c9a

          echo
          echo "===== CHECKOUT COMMIT ====="

          git checkout --detach 3516c9a

          echo
          echo "===== SOURCE INFORMATION ====="

          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit date:"
          git log -1 --format='%ci'

          echo
          echo "Commit message:"
          git log -1 --oneline

          echo
          echo "=============================================="
          

      # ==========================================================
      # 4. 显示源码版本
      # ==========================================================
      - name: Show source information
        run: |
          set -e

          cd lede

          echo
          echo "=============================================="
          echo "LEDE SOURCE INFORMATION"
          echo "=============================================="

          echo "Repository:"
          git remote get-url origin

          echo
          echo "Tag:"
          git describe --tags --always

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit date:"
          git log -1 --format='%ci'

          echo
          echo "Kernel directories:"
          find target/linux -maxdepth 2 -type d | sort | head -50

          echo
          echo "=============================================="

      # ==========================================================
      # 5. 添加第三方 feeds
      # ==========================================================
      - name: Add custom feeds
        run: |
          set -e

          cd lede

          echo "=============================================="
          echo "Adding custom feeds"
          echo "=============================================="

          cat >> feeds.conf.default <<EOF

          src-git kenzo ${KENZO_REPO}
          src-git small ${SMALL_REPO}
          EOF

          echo
          echo "===== feeds.conf.default ====="
          cat feeds.conf.default

      # ==========================================================
      # 6. 更新 feeds
      # ==========================================================
      - name: Update feeds
        run: |
          set -e

          cd lede

          ./scripts/feeds update -a

          ./scripts/feeds install -a

      # ==========================================================
      # 7. 导入用户配置
      # ==========================================================
      - name: Load x86_64 configuration
        run: |
          set -e

          cd lede

          if [ ! -f "../configs/x86_64.config" ]; then
            echo "ERROR: configs/x86_64.config not found"
            exit 1
          fi

          cp ../configs/x86_64.config .config

          echo
          echo "=============================================="
          echo "Original configuration"
          echo "=============================================="

          cat .config

      # ==========================================================
      # 8. 生成最终配置
      # ==========================================================
      - name: Generate defconfig
        run: |
          set -e

          cd lede

          make defconfig

          echo
          echo "=============================================="
          echo "FINAL CONFIGURATION"
          echo "=============================================="

          echo
          echo "Target:"
          grep '^CONFIG_TARGET_' .config || true

          echo
          echo "Wireless:"
          grep -E \
            'CONFIG_PACKAGE_(iw|iwinfo|wireless-regdb|kmod-mac80211|kmod-cfg80211|kmod-iwlwifi|kmod-iwlwifi-legacy|kmod-iwlwifi-5000)' \
            .config || true

          echo
          echo "VPN:"
          grep -E \
            'CONFIG_PACKAGE_(openvpn|openvpn-openssl|luci-app-openvpn)' \
            .config || true

          echo
          echo "SSR:"
          grep -Ei \
            'CONFIG_PACKAGE_.*(ssr|shadowsocks)' \
            .config || true

          echo
          echo "=============================================="

      # ==========================================================
      # 9. 检查关键配置
      # ==========================================================
      - name: Verify required configuration
        run: |
          set -e

          cd lede

          echo "=============================================="
          echo "VERIFY REQUIRED CONFIGURATION"
          echo "=============================================="

          check_config() {
            CONFIG="$1"

            if grep -q "^${CONFIG}=y" .config || \
               grep -q "^${CONFIG}=m" .config; then
              echo "[OK] ${CONFIG}"
            else
              echo "[WARNING] ${CONFIG} is NOT enabled"
            fi
          }

          echo
          echo "===== Target ====="
          check_config CONFIG_TARGET_x86
          check_config CONFIG_TARGET_x86_64

          echo
          echo "===== Wireless ====="
          check_config CONFIG_PACKAGE_iw
          check_config CONFIG_PACKAGE_iwinfo
          check_config CONFIG_PACKAGE_wireless-regdb
          check_config CONFIG_PACKAGE_kmod-cfg80211
          check_config CONFIG_PACKAGE_kmod-mac80211
          check_config CONFIG_PACKAGE_kmod-iwlwifi
          check_config CONFIG_PACKAGE_kmod-iwlwifi-legacy

          echo
          echo "===== OpenVPN ====="
          check_config CONFIG_PACKAGE_openvpn-openssl
          check_config CONFIG_PACKAGE_luci-app-openvpn

          echo
          echo "===== SSR ====="
          grep -E \
            '^CONFIG_PACKAGE_.*(shadowsocks|ssr)' \
            .config || true

          echo
          echo "=============================================="

      # ==========================================================
      # 10. 下载源码包
      # ==========================================================
      - name: Download packages
        run: |
          set -e

          cd lede

          make download -j8 V=s

      # ==========================================================
      # 11. 开始编译
      #
      # 第一次编译使用单线程，稳定性最高
      # ==========================================================
      - name: Build firmware
        run: |
          set -e

          cd lede

          echo
          echo "=============================================="
          echo "START BUILD"
          echo "=============================================="

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "Source:"
          git describe --tags --always

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "=============================================="

          make V=s -j1

      # ==========================================================
      # 12. 显示最终固件
      # ==========================================================
      - name: Show build output
        if: success()
        run: |
          set -e

          cd lede

          echo
          echo "=============================================="
          echo "BUILD SUCCESS"
          echo "=============================================="

          echo
          echo "Firmware directory:"
          find bin/targets -type f | sort

          echo
          echo "Firmware size:"
          du -ah bin/targets | sort -h | tail -30

          echo
          echo "=============================================="

      # ==========================================================
      # 13. 上传固件 Artifact
      # ==========================================================
      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64
          path: lede/bin/targets/x86_64/
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 14. 上传 IPK
      # ==========================================================
      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64-packages
          path: lede/bin/packages/x86_64/
          if-no-files-found: warn
          retention-days: 30
