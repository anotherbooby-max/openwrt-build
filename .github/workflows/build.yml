name: Build OpenWrt R22.3.13 x86_64


on:
  workflow_dispatch:


permissions:
  contents: write


env:

  SOURCE_REPO: https://github.com/coolsnowwolf/lede.git

  # 固定 R22.3.13 对应提交
  SOURCE_COMMIT: 3516c9a

  KENZO_REPO: https://github.com/kenzok8/openwrt-packages.git

  SMALL_REPO: https://github.com/kenzok8/small.git



jobs:


  build:


    runs-on: ubuntu-22.04


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses5-dev \
          libncurses-dev \
          libssl-dev \
          python3-setuptools \
          rsync \
          unzip \
          zlib1g-dev \
          file



    - name: Clone LEDE R22.3.13 source
      run: |

        set -e


        git clone \
          ${SOURCE_REPO} \
          lede


        cd lede


        echo "===== FETCH COMMIT ====="


        git fetch origin ${SOURCE_COMMIT}



        echo "===== CHECKOUT ====="


        git checkout ${SOURCE_COMMIT}



        echo "===== VERSION ====="


        git log -1 --oneline



    - name: Add kenzok8 packages
      run: |

        cd lede


        git clone --depth=1 \
        ${KENZO_REPO} \
        package/kenzo



        git clone --depth=1 \
        ${SMALL_REPO} \
        package/small



    - name: Update feeds
      run: |

        cd lede


        ./scripts/feeds update -a


        ./scripts/feeds install -a



    - name: Load x86_64 config
      run: |

        cd lede


        cp ../configs/x86_64.config .config


        make defconfig



    - name: Compile
      run: |

        cd lede


        make -j$(nproc) V=s



    - name: Collect firmware
      run: |

        mkdir output


        cp -r lede/bin/targets/x86/64/* output/



    - name: Upload firmware
      uses: actions/upload-artifact@v4

      with:

        name: OpenWrt-R22.3.13-x86_64

        path: output/
