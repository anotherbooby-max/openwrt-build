name: Build OpenWrt

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            mkisofs \
            msmtp \
            nano \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            upx-ucl \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

      - name: Clone LEDE
        run: |
          git clone --depth=1 \
            https://github.com/coolsnowwolf/lede.git \
            lede

      - name: Add kenzok8 packages
        run: |
          cd lede

          echo 'src-git kenzo https://github.com/kenzok8/openwrt-packages' \
            >> feeds.conf.default

      - name: Update feeds
        run: |
          cd lede

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load configuration
        run: |
          cd lede

          cp ../configs/x86_64.config .config

          make defconfig

      - name: Download sources
        run: |
          cd lede

          make download -j8

      - name: Build OpenWrt
        run: |
          cd lede

          make V=s -j2

      - name: Show build files
        run: |
          cd lede

          echo "========== BUILD OUTPUT =========="
          find bin/targets/x86/64 -maxdepth 2 -type f | sort

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64
          path: lede/bin/targets/x86/64/
          if-no-files-found: error
