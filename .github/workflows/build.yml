name: Build OpenWrt x86_64 WiFi


on:
  workflow_dispatch:


permissions:
  contents: write


env:
  TZ: Asia/Shanghai


jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 360


    steps:


    ##################################################
    # Checkout
    ##################################################

    - name: Checkout
      uses: actions/checkout@v5



    ##################################################
    # Free Disk
    ##################################################

    - name: Free disk space

      run: |

        df -h


        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/share/powershell || true
        sudo rm -rf /usr/local/share/chromium || true


        sudo docker system prune -af || true


        df -h



    ##################################################
    # Install Build Dependencies
    ##################################################

    - name: Install dependencies

      run: |

        sudo apt update


        sudo apt install -y \
        build-essential \
        clang \
        flex \
        bison \
        g++ \
        gawk \
        gcc-multilib \
        gettext \
        git \
        libncurses5-dev \
        libssl-dev \
        python3-distutils \
        python3-setuptools \
        rsync \
        unzip \
        zlib1g-dev \
        file \
        wget \
        curl \
        ccache \
        python3 \
        python3-pyelftools \
        qemu-utils \
        squashfs-tools



    ##################################################
    # Clone Source
    ##################################################

    - name: Clone OpenWrt Source

      run: |


        git clone --depth=1 \
        https://github.com/coolsnowwolf/lede.git \
        lede


        cd lede


        echo "SOURCE VERSION"

        git log -1



    ##################################################
    # Add packages
    ##################################################

    - name: Add kenzok8 packages

      run: |

        cd lede


        grep -q kenzok8 feeds.conf.default || \
        echo "src-git kenzo https://github.com/kenzok8/openwrt-packages" \
        >> feeds.conf.default



    ##################################################
    # Update feeds
    ##################################################

    - name: Update feeds


      run: |


        cd lede


        ./scripts/feeds update -a


        ./scripts/feeds install -a



    ##################################################
    # Config
    ##################################################

    - name: Prepare config


      run: |


        cd lede


        cp ../configs/x86_64.config .config


        make defconfig



        echo "======== WIFI CONFIG ========"


        grep -E \
        "kmod-(cfg80211|mac80211|iwlwifi)|iwinfo|wireless-regdb" \
        .config || true




    ##################################################
    # Download
    ##################################################

    - name: Download packages


      run: |


        cd lede


        make download -j4



    ##################################################
    # Compile
    ##################################################

    - name: Compile OpenWrt


      run: |


        cd lede


        make V=s -j2



    ##################################################
    # Check firmware
    ##################################################

    - name: Check output


      run: |


        cd lede


        ls -lh bin/targets/x86/64/


        echo

        echo "Images:"


        find bin/targets/x86/64 \
        -type f \
        \( \
        -name "*.img*" \
        -o -name "*.vmdk" \
        -o -name "*.qcow2" \
        -o -name "*.combined*" \
        \)



    ##################################################
    # Artifact
    ##################################################

    - name: Upload Artifact


      uses: actions/upload-artifact@v5


      with:


        name: openwrt-x86-64-wifi


        path:

          lede/bin/targets/x86/64/*



    ##################################################
    # Release
    ##################################################

    - name: Create Release


      uses: softprops/action-gh-release@v2


      with:


        tag_name: OpenWrt-${{ github.run_number }}


        name: OpenWrt x86_64 WiFi Build ${{ github.run_number }}


        files:


          lede/bin/targets/x86/64/*


      env:


        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
