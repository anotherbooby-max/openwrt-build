name: Build LEDE R22.3.13 x86_64

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          gawk \
          gettext \
          git \
          libncurses5-dev \
          libssl-dev \
          python3 \
          python3-setuptools \
          rsync \
          unzip \
          zlib1g-dev \
          file


    - name: Clone LEDE
      run: |

        git clone \
          https://github.com/coolsnowwolf/lede.git \
          lede

        cd lede

        echo "===== Tags ====="
        git tag | grep R22 | tail -20


        # 使用 R22.3.13 对应提交
        git checkout R22.3.13 || true


        git log -1


    - name: Add feeds
      run: |

        cd lede

        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Load config
      run: |

        cd lede

        cp ../x86_64.config .config

        make defconfig



    - name: Download
      run: |

        cd lede

        make download -j8


    - name: Build
      run: |

        cd lede

        make -j2 V=s



    - name: Show firmware
      run: |

        ls -lah lede/bin/targets/x86/64/


    - name: Upload firmware
      uses: actions/upload-artifact@v4

      with:

        name: lede-x86-64

        path: |
          lede/bin/targets/x86/64/*
