name: Build LEDE x86_64

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/coolsnowwolf/lede.git
  SOURCE_TAG: R22.5.5-x64-Release
  KENZO_REPO: https://github.com/kenzok8/openwrt-packages.git
  SMALL_REPO: https://github.com/kenzok8/small.git

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. 安装编译依赖
      # =========================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            libnsl-dev \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

      # =========================================================
      # 2. 获取 LEDE 源码
      # =========================================================
      - name: Clone LEDE source
        run: |
          set -e

          echo "=============================================="
          echo "Downloading LEDE source"
          echo "=============================================="

          git clone --depth=1 \
            --branch "${SOURCE_TAG}" \
            "${SOURCE_REPO}" \
            lede

          cd lede

          echo
          echo "===== SOURCE REMOTE ====="
          git remote -v

          echo
          echo "===== SOURCE TAG ====="
          git describe --tags --always --dirty

          echo
          echo "===== SOURCE COMMIT ====="
          git rev-parse HEAD

          echo
          echo "===== SOURCE COMMIT DATE ====="
          git log -1 --format='%ci'

          echo
          echo "=============================================="

      # =========================================================
      # 3. 严格检查源码
      # =========================================================
      - name: Verify LEDE source
        run: |
          set -e
          cd lede

          echo "===== VERIFY SOURCE ====="

          REMOTE=$(git remote get-url origin)
          echo "Remote: ${REMOTE}"

          if [[ "${REMOTE}" != *"coolsnowwolf/lede"* ]]; then
            echo "ERROR: Wrong source repository!"
            exit 1
          fi

          TAG=$(git describe --tags --always)

          echo "Tag: ${TAG}"

          if [[ "${TAG}" != "R22.5.5-x64-Release" ]]; then
            echo "ERROR: Wrong LEDE version!"
            echo "Expected: R22.5.5-x64-Release"
            echo "Actual:   ${TAG}"
            exit 1
          fi

          echo
          echo "LEDE source verification PASSED."

      # =========================================================
      # 4. 添加 kenzok8 feeds
      # =========================================================
      - name: Add kenzok8 feeds
        run: |
          set -e
          cd lede

          echo "===== ORIGINAL FEEDS ====="
          cat feeds.conf.default

          echo
          echo "===== ADD KENZOK FEEDS ====="

          cat >> feeds.conf.default <<EOF

          src-git kenzo ${KENZO_REPO}
          src-git small ${SMALL_REPO}
          EOF

          echo
          echo "===== FINAL FEEDS ====="
          cat feeds.conf.default

      # =========================================================
      # 5. 更新 feeds
      # =========================================================
      - name: Update feeds
        run: |
          set -e
          cd lede

          ./scripts/feeds update -a

          ./scripts/feeds install -a

          echo
          echo "===== FEEDS INSTALLED ====="
          ls -lah feeds/

      # =========================================================
      # 6. 检查用户配置文件
      # =========================================================
      - name: Check x86_64 config
        run: |
          set -e

          test -f configs/x86_64.config

          echo "===== CONFIG FILE ====="
          cat configs/x86_64.config

      # =========================================================
      # 7. 导入 x86_64 配置
      # =========================================================
      - name: Prepare x86_64 configuration
        run: |
          set -e
          cd lede

          cp ../configs/x86_64.config .config

          echo
          echo "===== RUN DEFCONFIG ====="

          make defconfig

          echo
          echo "===== TARGET ====="

          grep -E \
            'CONFIG_TARGET_x86|CONFIG_TARGET_x86_64' \
            .config || true

      # =========================================================
      # 8. 检查关键无线配置
      # =========================================================
      - name: Verify Intel WiFi configuration
        run: |
          set -e
          cd lede

          echo "=============================================="
          echo "Checking Intel WiFi Link 5100 configuration"
          echo "=============================================="

          REQUIRED_CONFIGS="
          CONFIG_PACKAGE_kmod-cfg80211
          CONFIG_PACKAGE_kmod-mac80211
          CONFIG_PACKAGE_kmod-iwlwifi
          CONFIG_PACKAGE_iwlwifi-firmware-iwl5000
          CONFIG_PACKAGE_wireless-regdb
          CONFIG_PACKAGE_iw
          CONFIG_PACKAGE_iwinfo
          "

          FAILED=0

          for CONFIG in ${REQUIRED_CONFIGS}; do
            if grep -q "^${CONFIG}=y" .config; then
              echo "[OK] ${CONFIG}"
            else
              echo "[ERROR] ${CONFIG}"
              FAILED=1
            fi
          done

          if [ "${FAILED}" -ne 0 ]; then
            echo
            echo "ERROR: Required Intel WiFi configuration is missing!"
            echo
            echo "The build will NOT start."
            echo "This prevents wasting GitHub Actions build time."
            exit 1
          fi

          echo
          echo "Intel WiFi configuration PASSED."

      # =========================================================
      # 9. 检查 SSR Plus
      # =========================================================
      - name: Verify SSR Plus
        run: |
          set -e
          cd lede

          echo "===== SEARCH SSR PLUS ====="

          find feeds -type f \
            \( -name Makefile -o -name '*.mk' \) \
            2>/dev/null \
            | xargs grep -l "luci-app-ssr-plus" \
            2>/dev/null \
            | head -20 || true

          if find feeds package -type d \
            -name "luci-app-ssr-plus" \
            2>/dev/null \
            | grep -q .; then

            echo "[OK] luci-app-ssr-plus source found"

          else

            echo "[ERROR] luci-app-ssr-plus source NOT found"
            exit 1

          fi

      # =========================================================
      # 10. 再次生成最终配置
      # =========================================================
      - name: Finalize configuration
        run: |
          set -e
          cd lede

          make defconfig

          echo
          echo "===== FINAL IMPORTANT CONFIG ====="

          grep -E \
            'CONFIG_TARGET_x86|CONFIG_PACKAGE_kmod-cfg80211|CONFIG_PACKAGE_kmod-mac80211|CONFIG_PACKAGE_kmod-iwlwifi|CONFIG_PACKAGE_iwlwifi-firmware-iwl5000|CONFIG_PACKAGE_wireless-regdb|CONFIG_PACKAGE_iw=|CONFIG_PACKAGE_iwinfo|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_luci-app-ssr-plus|CONFIG_PACKAGE_openvpn' \
            .config || true

      # =========================================================
      # 11. 输出最终版本信息
      # =========================================================
      - name: Print build information
        run: |
          cd lede

          echo
          echo "================================================"
          echo "FINAL BUILD INFORMATION"
          echo "================================================"

          echo
          echo "Repository:"
          git remote get-url origin

          echo
          echo "Tag:"
          git describe --tags --always

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit date:"
          git log -1 --format='%ci'

          echo
          echo "OpenWrt release file:"
          cat package/base-files/files/etc/openwrt_release || true

          echo
          echo "================================================"

      # =========================================================
      # 12. 下载源码包
      # =========================================================
      - name: Download package sources
        run: |
          set -e
          cd lede

          make download -j8 V=s

      # =========================================================
      # 13. 编译
      # =========================================================
      - name: Build firmware
        run: |
          set -e
          cd lede

          echo "=============================================="
          echo "START LEDE x86_64 BUILD"
          echo "=============================================="

          make -j$(nproc) V=s

      # =========================================================
      # 14. 显示编译结果
      # =========================================================
      - name: Show build output
        run: |
          set -e
          cd lede

          echo "=============================================="
          echo "BUILD OUTPUT"
          echo "=============================================="

          find bin/targets -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.efi" \
              -o -name "*.gz" \
              -o -name "*.vmdk" \
              -o -name "*.qcow2" \
              -o -name "*.ipk" \
            \) \
            -print

          echo
          echo "=============================================="
          du -sh bin/targets/* || true

      # =========================================================
      # 15. 创建 Release 文件包
      # =========================================================
      - name: Package release files
        run: |
          set -e

          mkdir -p release

          cp -a lede/bin/targets/*/* release/

          echo
          echo "===== RELEASE FILES ====="

          find release -type f -printf '%p\n' | sort

          echo
          echo "===== CREATE ARCHIVE ====="

          tar -czf \
            "lede-x86_64-${SOURCE_TAG}.tar.gz" \
            -C release .

          echo
          echo "Archive:"
          ls -lh "lede-x86_64-${SOURCE_TAG}.tar.gz"

      # =========================================================
      # 16. 上传 GitHub Actions Artifact
      # =========================================================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lede-x86_64-${{ env.SOURCE_TAG }}
          path: |
            release/**
            lede-x86_64-${{ env.SOURCE_TAG }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 17. 创建 GitHub Release
      # =========================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.SOURCE_TAG }}-${{ github.run_number }}
          name: LEDE x86_64 ${{ env.SOURCE_TAG }} Build ${{ github.run_number }}
          generate_release_notes: false
          body: |
            # LEDE x86_64

            ## Source

            Repository:
            https://github.com/coolsnowwolf/lede

            Source tag:
            `${{ env.SOURCE_TAG }}`

            Build:
            `${{ github.run_number }}`

            Commit:
            `${{ github.sha }}`

            ## Target

            x86_64

            ## Wireless

            Intel WiFi Link 5100 support included:

            - kmod-cfg80211
            - kmod-mac80211
            - kmod-iwlwifi
            - iwlwifi-firmware-iwl5000
            - wireless-regdb
            - iw
            - iwinfo

            ## Packages

            - LuCI
            - SSR Plus
            - OpenVPN

            ## Important

            This firmware is built from Lean's LEDE source.
            It is NOT the official OpenWrt 24.10/25.12 source tree.

          files: |
            lede-x86_64-${{ env.SOURCE_TAG }}.tar.gz
            release/**

          fail_on_unmatched_files: true
          draft: false
          prerelease: false
