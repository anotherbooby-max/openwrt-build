name: Build OpenWrt 18.06.9 x86_64


on:
  workflow_dispatch:


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 360


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          gcc \
          g++ \
          flex \
          bison \
          gawk \
          make \
          gettext \
          libncurses5-dev \
          libssl-dev \
          python \
          unzip \
          zlib1g-dev \
          file \
          wget \
          git \
          rsync



    - name: Clone OpenWrt 18.06.9
      run: |

        git clone \
        --depth=1 \
        -b v18.06.9 \
        https://github.com/openwrt/openwrt.git \
        openwrt



    - name: Update feeds
      run: |

        cd openwrt

        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Load config
      run: |

        cd openwrt

        cp ../configs/x86_64.config .config

        make defconfig



        echo "===== Wireless config ====="

        grep -E \
        "iwl|mac80211|cfg80211|hostapd|wpad" \
        .config || true



    - name: Download
      run: |

        cd openwrt

        make download -j2



    - name: Build
      run: |

        cd openwrt

        make -j2 V=s



    - name: Check firmware
      run: |

        cd openwrt

        echo "===== OUTPUT ====="

        find bin/targets/x86



    - name: Upload firmware
      uses: actions/upload-artifact@v4

      with:

        name: OpenWrt-18.06.9-x86_64

        path:

          openwrt/bin/targets/x86/64/*


