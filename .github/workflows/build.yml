name: Build OpenWrt x86_64 LEDE

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master
  TARGET_PROFILE: x86/64

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. 检出自己的 openwrt-build 仓库
      # ==========================================================
      - name: Checkout build repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 安装编译环境
      # ==========================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            rsync \
            unzip \
            wget \
            curl \
            file \
            python3 \
            python3-distutils \
            python3-setuptools \
            python3-pip \
            python3-pyelftools \
            libncurses5-dev \
            libncursesw5-dev \
            zlib1g-dev \
            libssl-dev \
            xsltproc \
            swig \
            time \
            ccache \
            gettext \
            libelf-dev \
            device-tree-compiler \
            qemu-utils \
            subversion \
            unzip

      # ==========================================================
      # 3. 克隆 coolsnowwolf/lede
      #
      # 注意：
      # 不能使用 --branch R21.02
      #
      # coolsnowwolf/lede 没有 R21.02 分支
      # ==========================================================
      - name: Clone coolsnowwolf LEDE
        run: |
          git clone \
            --depth=1 \
            --branch "${REPO_BRANCH}" \
            "${REPO_URL}" \
            lede

          cd lede

          echo "========================================"
          echo "LEDE 源码信息"
          echo "========================================"

          echo "Repository:"
          git remote -v

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit short:"
          git rev-parse --short HEAD

          echo
          echo "Commit message:"
          git log -1 --pretty=format:"%s"

          echo
          echo "========================================"

      # ==========================================================
      # 4. 检查源码 Makefile
      # ==========================================================
      - name: Check LEDE version
        run: |
          cd lede

          echo "========================================"
          echo "Makefile 版本信息"
          echo "========================================"

          grep -E '^(DISTRIB_ID|DISTRIB_RELEASE|DISTRIB_REVISION)' \
            include/version.mk \
            2>/dev/null || true

          echo
          echo "源码 Makefile："
          head -40 Makefile

          echo
          echo "========================================"

      # ==========================================================
      # 5. 添加 kenzok8/openwrt-packages
      # ==========================================================
      - name: Add kenzok8 packages
        run: |
          cd lede

          echo "src-git kenzo https://github.com/kenzok8/openwrt-packages" \
            >> feeds.conf.default

          echo "========================================"
          echo "feeds.conf.default"
          echo "========================================"

          cat feeds.conf.default

          echo "========================================"

      # ==========================================================
      # 6. 更新 feeds
      # ==========================================================
      - name: Update feeds
        run: |
          cd lede

          ./scripts/feeds update -a

      # ==========================================================
      # 7. 安装 feeds
      # ==========================================================
      - name: Install feeds
        run: |
          cd lede

          ./scripts/feeds install -a

      # ==========================================================
      # 8. 使用你的 x86_64 配置文件
      # ==========================================================
      - name: Load x86_64 configuration
        run: |
          cd lede

          echo "========================================"
          echo "加载 configs/x86_64.config"
          echo "========================================"

          if [ ! -f ../configs/x86_64.config ]; then
            echo "错误：configs/x86_64.config 不存在"
            exit 1
          fi

          cp ../configs/x86_64.config .config

          echo
          echo "TARGET 配置："
          grep '^CONFIG_TARGET' .config || true

          echo
          echo "========================================"

      # ==========================================================
      # 9. 强制设置 x86_64
      # ==========================================================
      - name: Configure x86_64 target
        run: |
          cd lede

          cat >> .config <<'EOF'

          # ======================================================
          # x86_64 target
          # ======================================================

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          EOF

          make defconfig

          echo "========================================"
          echo "最终 TARGET 配置"
          echo "========================================"

          grep '^CONFIG_TARGET' .config

          echo "========================================"

      # ==========================================================
      # 10. 无线驱动
      #
      # Intel Wireless 5100
      # PCI ID:
      # 8086:4232
      #
      # 对应 iwlwifi
      # ==========================================================
      - name: Configure Intel wireless drivers
        run: |
          cd lede

          cat >> .config <<'EOF'

          # ======================================================
          # Wireless
          # ======================================================

          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_wireless-regdb=y

          CONFIG_PACKAGE_kmod-cfg80211=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_PACKAGE_kmod-iwlwifi=y

          CONFIG_PACKAGE_kmod-iwlwifi-5xxx=y

          EOF

          make defconfig

          echo "========================================"
          echo "Wireless configuration"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(iw|iwinfo|wireless-regdb|kmod-cfg80211|kmod-mac80211|kmod-iwlwifi)' \
            .config || true

          echo "========================================"

      # ==========================================================
      # 11. SSR Plus
      # ==========================================================
      - name: Configure SSR Plus
        run: |
          cd lede

          cat >> .config <<'EOF'

          # ======================================================
          # SSR Plus
          # ======================================================

          CONFIG_PACKAGE_luci-app-ssr-plus=y

          EOF

          make defconfig

      # ==========================================================
      # 12. OpenVPN
      # ==========================================================
      - name: Configure OpenVPN
        run: |
          cd lede

          cat >> .config <<'EOF'

          # ======================================================
          # OpenVPN
          # ======================================================

          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_luci-app-openvpn=y

          EOF

          make defconfig

      # ==========================================================
      # 13. 输出最终配置
      # ==========================================================
      - name: Show final configuration
        run: |
          cd lede

          echo "========================================"
          echo "最终 .config"
          echo "========================================"

          grep -E \
            'CONFIG_TARGET|CONFIG_PACKAGE_(iw|iwinfo|wireless-regdb|kmod-cfg80211|kmod-mac80211|kmod-iwlwifi|luci-app-ssr-plus|openvpn)' \
            .config || true

          echo
          echo "========================================"
          echo "LEDE commit"
          echo "========================================"

          git rev-parse HEAD

          echo
          echo "========================================"

      # ==========================================================
      # 14. 下载编译依赖
      # ==========================================================
      - name: Download packages
        run: |
          cd lede

          make download -j8 V=s

      # ==========================================================
      # 15. 编译
      # ==========================================================
      - name: Build firmware
        run: |
          cd lede

          echo "========================================"
          echo "开始编译 OpenWrt LEDE x86_64"
          echo "========================================"

          make -j$(nproc) V=s

      # ==========================================================
      # 16. 显示编译结果
      # ==========================================================
      - name: List firmware files
        run: |
          cd lede

          echo "========================================"
          echo "编译完成"
          echo "========================================"

          find bin/targets/x86/64/ \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort

          echo
          echo "========================================"

      # ==========================================================
      # 17. 保存 GitHub Actions Artifact
      # ==========================================================
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-lede-x86_64
          path: |
            lede/bin/targets/x86/64/*
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 18. 获取版本信息
      # ==========================================================
      - name: Generate release information
        id: release_info
        run: |
          cd lede

          COMMIT=$(git rev-parse --short HEAD)

          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Release commit: ${COMMIT}"
          echo "========================================"

      # ==========================================================
      # 19. 打包 Release 文件
      # ==========================================================
      - name: Prepare release files
        run: |
          mkdir -p release

          cp -av lede/bin/targets/x86/64/* \
            release/

          echo "========================================"
          echo "Release 文件"
          echo "========================================"

          ls -lah release/

      # ==========================================================
      # 20. 创建 GitHub Release
      # ==========================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "lede-x86_64-${{ github.run_number }}"
          name: "LEDE x86_64 Build ${{ github.run_number }}"
          body: |
            ## OpenWrt LEDE x86_64

            ### Source

            Repository:
            https://github.com/coolsnowwolf/lede

            Branch:
            `${{ env.REPO_BRANCH }}`

            Commit:
            `${{ steps.release_info.outputs.commit }}`

            Target:
            `x86/64`

            Build:
            `${{ github.run_number }}`

            ### Included

            - x86_64
            - Intel iwlwifi
            - cfg80211
            - mac80211
            - wireless-regdb
            - iw
            - iwinfo
            - SSR Plus
            - OpenVPN
            - kenzok8/openwrt-packages

            ### Important

            本固件使用的是：

            `coolsnowwolf/lede`

            而不是：

            `openwrt/openwrt`

          files: |
            release/*
          draft: false
          prerelease: false
