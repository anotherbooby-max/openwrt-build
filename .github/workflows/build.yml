name: Build OpenWrt x86_64 Intel5100 AP

on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    env:

      SOURCE_REPO: https://github.com/coolsnowwolf/lede.git

      # 2022年前后稳定提交
      SOURCE_COMMIT: 9f26e6205


      TARGET: x86_64


    steps:


    - name: Checkout build repo
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          gawk \
          gcc-multilib \
          g++-multilib \
          gettext \
          git \
          libncurses5-dev \
          libssl-dev \
          python3-distutils \
          rsync \
          unzip \
          zlib1g-dev \
          file



    - name: Clone LEDE source
      run: |

        git clone \
          ${SOURCE_REPO} \
          lede


        cd lede


        echo "===== current ====="

        git log -1 --oneline


        echo "===== checkout commit ====="

        git checkout ${SOURCE_COMMIT}


        echo "===== version ====="

        git log -1 --oneline



    - name: Add wireless packages
      run: |

        cd lede


        ./scripts/feeds update -a


        ./scripts/feeds install -a



    - name: Load x86 config
      run: |

        cd lede


        cp ../configs/x86_64.config .config


        make defconfig



    - name: Verify wireless
      run: |

        cd lede


        grep IWL .config || true

        grep MAC80211 .config || true

        grep HOSTAPD .config || true



    - name: Download sources
      run: |

        cd lede

        make download -j8



    - name: Compile
      run: |

        cd lede


        make -j$(nproc) V=s



    - name: Collect firmware
      run: |

        mkdir output


        cp -r \
        lede/bin/targets/x86/64/* \
        output/



    - name: Upload firmware
      uses: actions/upload-artifact@v4

      with:

        name: openwrt-x86_64-intel5100

        path: output/
