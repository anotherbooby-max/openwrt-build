name: Build OpenWrt R22.3.13 x86_64 WiFi5100


on:
  workflow_dispatch:


env:

  SOURCE_REPO: https://github.com/coolsnowwolf/lede.git

  SOURCE_BRANCH: openwrt-22.03

  TARGET: x86_64


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    - name: Checkout build config
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zstd



    - name: Clone LEDE R22.3.13 source
      run: |

        git clone \
        --depth=1 \
        --branch ${SOURCE_BRANCH} \
        ${SOURCE_REPO} \
        lede


        cd lede


        echo "===== SOURCE ====="

        git branch

        git log -1 --oneline



    - name: Add kenzok8 packages
      run: |

        cd lede


        git clone \
        --depth=1 \
        https://github.com/kenzok8/openwrt-packages.git \
        package/kenzo



    - name: Update feeds
      run: |

        cd lede


        ./scripts/feeds update -a


        ./scripts/feeds install -a



    - name: Load x86_64 config

      run: |

        cd lede


        cp ../configs/x86_64.config .config


        make defconfig



    - name: Verify wireless

      run: |

        cd lede


        grep -E \
        "iwlwifi|mac80211|hostapd|wpad" \
        .config || true



    - name: Download sources

      run: |

        cd lede


        make download -j8



    - name: Compile OpenWrt

      run: |

        cd lede


        make -j$(nproc) V=s



    - name: Collect firmware

      run: |

        mkdir firmware


        cp -rf \
        lede/bin/targets/x86/64/* \
        firmware/



    - name: Upload firmware

      uses: actions/upload-artifact@v4

      with:

        name: OpenWrt-R22.3.13-x86_64-WIFI5100

        path: firmware/
