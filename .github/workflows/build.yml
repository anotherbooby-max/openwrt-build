name: Build OpenWrt R22.12.1 x86_64 WiFi5100


on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    env:

      SOURCE_REPO: https://github.com/coolsnowwolf/lede.git

      SOURCE_TAG: R22.12.1

      TARGET: x86_64


    steps:


    - name: Checkout build config

      uses: actions/checkout@v4



    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y \
        build-essential \
        clang \
        flex \
        bison \
        g++ \
        gawk \
        gcc-multilib \
        gettext \
        git \
        libncurses-dev \
        libssl-dev \
        python3 \
        rsync \
        unzip \
        zlib1g-dev



    - name: Clone LEDE source

      run: |

        git clone \
        ${SOURCE_REPO} \
        lede


        cd lede


        echo "===== TAG LIST ====="

        git tag | grep R22



        echo "===== Checkout ====="

        git checkout ${SOURCE_TAG}



        echo "===== VERSION ====="

        git describe --tags

        git log -1 --oneline




    - name: Add wireless packages

      run: |

        cd lede


        echo "

        CONFIG_PACKAGE_kmod-iwlwifi=y
        CONFIG_PACKAGE_iwlwifi-firmware=y
        CONFIG_PACKAGE_iwlwifi-firmware-5000=y

        CONFIG_PACKAGE_kmod-mac80211=y
        CONFIG_PACKAGE_kmod-cfg80211=y
        CONFIG_PACKAGE_wireless-regdb=y

        CONFIG_PACKAGE_wpad=y
        CONFIG_PACKAGE_hostapd-common=y

        CONFIG_PACKAGE_luci=y

        " >> .config



    - name: Load x86 config

      run: |

        cd lede


        cp ../configs/x86_64.config .config


        make defconfig



    - name: Download sources

      run: |

        cd lede

        make download -j8



    - name: Compile

      run: |

        cd lede

        make -j$(nproc) V=s



    - name: Collect firmware

      run: |

        mkdir output

        cp -rf lede/bin/targets/x86/64/* output/



    - name: Upload firmware

      uses: actions/upload-artifact@v4

      with:

        name: openwrt-r22.12.1-x86_64-iwlwifi5100

        path: output
