```yaml
name: Build LEDE 21.02 x86_64

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. Checkout 自己的仓库
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. 安装编译环境
      # =========================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            gcc-multilib \
            g++-multilib \
            gettext \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            curl \
            git \
            gawk \
            flex \
            bison \
            swig \
            xsltproc \
            zlib1g-dev \
            file \
            time \
            ccache \
            patch \
            pkg-config \
            libelf-dev \
            libtool \
            autoconf \
            automake


      # =========================================================
      # 3. 下载 LEDE 源码
      #
      # 注意：
      # 不再使用不存在的 R21.02 branch
      #
      # 这里必须锁定到 LEDE 21.02 时代的 commit。
      # =========================================================
      - name: Clone LEDE 21.02 source
        run: |
          rm -rf lede

          git clone https://github.com/coolsnowwolf/lede.git lede

          cd lede

          echo "========================================"
          echo "        LEDE SOURCE"
          echo "========================================"

          git remote -v

          echo
          echo "Current HEAD:"
          git log -1 --oneline

          echo
          echo "Repository branches/tags:"
          git tag --list | tail -30


      # =========================================================
      # 4. 强制检查源码版本
      #
      # 这里非常重要：
      # 防止误编译成 24.10 / 25.12
      # =========================================================
      - name: Verify LEDE source
        run: |
          cd lede

          echo "========================================"
          echo "        VERIFY SOURCE"
          echo "========================================"

          echo
          echo "Git commit:"
          git rev-parse HEAD

          echo
          echo "Git describe:"
          git describe --tags --always || true

          echo
          echo "Makefile version:"
          grep -E \
            '^(DISTRIB_RELEASE|VERSION_NUMBER|VERSION_CODE|VERSION_NICK|VERSION_REPO)' \
            include/version.mk \
            2>/dev/null || true

          echo
          echo "Checking for OpenWrt 24.10/25.12..."

          if grep -R \
            -E \
            '24\.10|25\.12|openwrt-25\.12|openwrt-24\.10' \
            include package target \
            2>/dev/null | head -20; then

            echo
            echo "ERROR: Wrong OpenWrt version detected!"
            exit 1
          fi

          echo
          echo "Source verification passed."


      # =========================================================
      # 5. 添加 kenzok8
      # =========================================================
      - name: Add kenzok8 packages
        run: |
          cd lede

          echo "========================================"
          echo "        ADD KENZOK8"
          echo "========================================"

          echo 'src-git kenzo https://github.com/kenzok8/openwrt-packages' \
            >> feeds.conf.default

          echo
          cat feeds.conf.default


      # =========================================================
      # 6. 显示 feeds
      #
      # 绝对不能出现：
      # openwrt-25.12
      # openwrt-24.10
      # =========================================================
      - name: Check feeds
        run: |
          cd lede

          echo "========================================"
          echo "        FEEDS CHECK"
          echo "========================================"

          cat feeds.conf.default

          if grep -E \
            'openwrt-25\.12|openwrt-24\.10' \
            feeds.conf.default; then

            echo
            echo "ERROR: Wrong LuCI/OpenWrt feed detected!"
            exit 1
          fi


      # =========================================================
      # 7. 更新 feeds
      # =========================================================
      - name: Update feeds
        run: |
          cd lede

          ./scripts/feeds update -a
          ./scripts/feeds install -a


      # =========================================================
      # 8. 创建 x86_64 配置
      # =========================================================
      - name: Create x86_64 config
        run: |
          cd lede

          cat > .config <<'EOF'

# =========================================================
# Target
# =========================================================

CONFIG_TARGET_x86=y
CONFIG_TARGET_x86_64=y
CONFIG_TARGET_x86_64_DEVICE_generic=y


# =========================================================
# LuCI
# =========================================================

CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y
CONFIG_PACKAGE_luci-base=y


# =========================================================
# Network
# =========================================================

CONFIG_PACKAGE_iperf3=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_wget=y
CONFIG_PACKAGE_tcpdump=y


# =========================================================
# Wireless
# =========================================================

CONFIG_PACKAGE_iw=y
CONFIG_PACKAGE_iwinfo=y
CONFIG_PACKAGE_wireless-regdb=y

CONFIG_PACKAGE_kmod-cfg80211=y
CONFIG_PACKAGE_kmod-mac80211=y

CONFIG_PACKAGE_kmod-iwlwifi=y


# =========================================================
# Intel Wireless firmware
# Intel 5100 / 5000 series
# =========================================================

CONFIG_PACKAGE_iwlwifi-firmware-iwl5000=y


# =========================================================
# USB
# =========================================================

CONFIG_PACKAGE_kmod-usb-core=y
CONFIG_PACKAGE_kmod-usb2=y
CONFIG_PACKAGE_kmod-usb3=y


# =========================================================
# Ethernet
# =========================================================

CONFIG_PACKAGE_kmod-r8169=y
CONFIG_PACKAGE_kmod-r8125=y


# =========================================================
# OpenVPN
# =========================================================

CONFIG_PACKAGE_openvpn-openssl=y
CONFIG_PACKAGE_luci-app-openvpn=y


# =========================================================
# Firewall
# =========================================================

CONFIG_PACKAGE_iptables=y


# =========================================================
# IPv6
# =========================================================

CONFIG_PACKAGE_odhcp6c=y
CONFIG_PACKAGE_odhcpd-ipv6only=y


# =========================================================
# SSH
# =========================================================

CONFIG_PACKAGE_dropbear=y


# =========================================================
# Useful tools
# =========================================================

CONFIG_PACKAGE_bash=y
CONFIG_PACKAGE_coreutils=y
CONFIG_PACKAGE_htop=y
CONFIG_PACKAGE_nano=y
CONFIG_PACKAGE_vim-full=y


# =========================================================
# Kernel modules
# =========================================================

CONFIG_PACKAGE_kmod-crypto-cbc=y
CONFIG_PACKAGE_kmod-crypto-hash=y
CONFIG_PACKAGE_kmod-crypto-hmac=y


# =========================================================
# Automatically include firmware
# =========================================================

CONFIG_PACKAGE_linux-firmware=y

EOF

          echo "========================================"
          echo "        RAW CONFIG"
          echo "========================================"

          cat .config


      # =========================================================
      # 9. 生成最终配置
      # =========================================================
      - name: Generate final config
        run: |
          cd lede

          make defconfig

          echo
          echo "========================================"
          echo "        FINAL TARGET"
          echo "========================================"

          grep '^CONFIG_TARGET_' .config || true

          echo
          echo "========================================"
          echo "        FINAL WIRELESS"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(iw|iwinfo|wireless-regdb|kmod-cfg80211|kmod-mac80211|kmod-iwlwifi)' \
            .config || true

          echo
          echo "========================================"
          echo "        FIRMWARE"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_.*iwl.*firmware' \
            .config || true


      # =========================================================
      # 10. 下载源码包
      # =========================================================
      - name: Download sources
        run: |
          cd lede

          make download -j2 V=s


      # =========================================================
      # 11. 编译
      # =========================================================
      - name: Build OpenWrt
        run: |
          cd lede

          echo "========================================"
          echo "        START BUILD"
          echo "========================================"

          free -h
          df -h

          make V=s -j2


      # =========================================================
      # 12. 显示编译结果
      # =========================================================
      - name: Show build result
        if: success()
        run: |
          cd lede

          echo "========================================"
          echo "        BUILD RESULT"
          echo "========================================"

          find bin/targets/x86/64 \
            -maxdepth 2 \
            -type f \
            -printf '%p\t%k KB\n' \
            | sort


      # =========================================================
      # 13. 保存完整配置
      # =========================================================
      - name: Save config
        if: success()
        run: |
          cd lede

          mkdir -p ../release

          cp .config ../release/config

          cp include/version.mk \
            ../release/version.mk

          git rev-parse HEAD \
            > ../release/source-commit.txt

          git describe --tags --always \
            > ../release/source-version.txt

          cp feeds.conf.default \
            ../release/feeds.conf.default


      # =========================================================
      # 14. 复制固件
      # =========================================================
      - name: Prepare release files
        if: success()
        run: |
          cd lede

          mkdir -p ../release/firmware

          cp -av \
            bin/targets/x86/64/* \
            ../release/firmware/


      # =========================================================
      # 15. 打包 Release
      # =========================================================
      - name: Create release archive
        if: success()
        run: |
          cd release

          tar -czf \
            LEDE-x86_64-21.02-wireless.tar.gz \
            firmware \
            config \
            version.mk \
            source-commit.txt \
            source-version.txt \
            feeds.conf.default


      # =========================================================
      # 16. 自动发布 GitHub Release
      # =========================================================
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: LEDE-21.02-${{ github.run_number }}
          name: LEDE 21.02 x86_64 Build ${{ github.run_number }}
          body: |
            # LEDE 21.02 x86_64

            ## Source

            Repository:
            https://github.com/coolsnowwolf/lede

            ## Target

            x86_64

            ## Wireless

            - cfg80211
            - mac80211
            - iwlwifi
            - iw
            - iwinfo
            - wireless-regdb
            - Intel 5000 series firmware

            ## Network

            - OpenVPN
            - Ethernet
            - IPv4
            - IPv6

            ## Important

            This build is intended for the Intel Wireless WiFi Link 5100.

          files: |
            release/LEDE-x86_64-21.02-wireless.tar.gz
            release/config
            release/source-commit.txt
            release/source-version.txt
            release/feeds.conf.default

            release/firmware/*
```
