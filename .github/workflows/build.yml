name: Build OpenWrt x86_64 Intel5100

on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    env:

      SOURCE_REPO: https://github.com/coolsnowwolf/lede.git
      SOURCE_TAG: R22.12.1


    steps:


    - name: Checkout build repo
      uses: actions/checkout@v4



    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y \
        build-essential \
        clang \
        flex \
        bison \
        g++ \
        gawk \
        gettext \
        git \
        libncurses5-dev \
        libssl-dev \
        python3 \
        unzip \
        zlib1g-dev \
        file



    - name: Clone LEDE

      run: |

        git clone \
        ${SOURCE_REPO} \
        lede


        cd lede


        echo "===== FETCH TAG ====="

        git fetch --tags


        git checkout ${SOURCE_TAG}



        echo "===== VERSION ====="

        git describe --tags

        git log -1 --oneline



    - name: Add wireless packages

      run: |

        cd lede


        echo "CONFIG_PACKAGE_kmod-iwlwifi=y" >> .config

        echo "CONFIG_PACKAGE_iwlwifi-firmware=y" >> .config

        echo "CONFIG_PACKAGE_iwlwifi-firmware-5000=y" >> .config


        echo "CONFIG_PACKAGE_kmod-mac80211=y" >> .config


        echo "CONFIG_PACKAGE_hostapd-common=y" >> .config

        echo "CONFIG_PACKAGE_wpad=y" >> .config



    - name: Update feeds

      run: |

        cd lede


        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Load x86 config

      run: |

        cd lede


        cp ../configs/x86_64.config .config


        make defconfig



    - name: Verify wireless

      run: |

        cd lede


        grep iwlwifi .config || true

        grep mac80211 .config || true



    - name: Download sources

      run: |

        cd lede

        make download -j4



    - name: Compile

      run: |

        cd lede


        make V=s -j2



    - name: Collect firmware

      run: |

        mkdir -p output


        cp lede/bin/targets/x86/64/*.img.gz output/ || true

        cp lede/bin/targets/x86/64/*.img output/ || true

        cp lede/bin/targets/x86/64/*.manifest output/ || true


        find lede/bin/targets/x86/64 -maxdepth 2 -type f



    - name: Upload firmware

      uses: actions/upload-artifact@v4

      with:

        name: openwrt-x86-64-intel5100

        path: output/
