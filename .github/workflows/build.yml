name: Build OpenWrt x86_64 iwlwifi5100


on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    env:

      SOURCE_REPO: https://github.com/coolsnowwolf/lede.git

      SOURCE_COMMIT: 9f26e6205

      TARGET: x86_64


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
        build-essential \
        gcc \
        g++ \
        flex \
        bison \
        gawk \
        gettext \
        git \
        libncurses5-dev \
        libssl-dev \
        python3 \
        unzip \
        rsync \
        zlib1g-dev \
        file



    - name: Clone LEDE

      run: |

        git clone \
        ${SOURCE_REPO} \
        lede


        cd lede


        git checkout ${SOURCE_COMMIT}


        echo "===== VERSION ====="

        git log -1



    - name: Add wireless packages

      run: |

        cd lede


        mkdir -p package/custom


        cat > package/custom/Makefile <<EOF

        include \$(TOPDIR)/rules.mk


        PKG_NAME:=iwlwifi-firmware-extra
        PKG_RELEASE:=1


        include \$(INCLUDE_DIR)/package.mk


        define Package/iwlwifi-firmware-extra
        SECTION:=firmware
        CATEGORY:=Firmware
        TITLE:=Intel iwlwifi 5000 firmware
        endef


        define Package/iwlwifi-firmware-extra/install

        endef


        \$(eval \$(call BuildPackage,iwlwifi-firmware-extra))

        EOF



    - name: Update feeds

      run: |

        cd lede

        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Load config

      run: |

        cd lede


        cp ../configs/x86_64.config .config


        make defconfig



    - name: Download source

      run: |

        cd lede

        make download -j4



    - name: Compile

      run: |

        cd lede


        make -j$(nproc) V=s



    - name: Collect firmware

      run: |

        mkdir output


        cp -rf \
        lede/bin/targets/x86/64/* \
        output/



    - name: Upload firmware

      uses: actions/upload-artifact@v4

      with:

        name: openwrt-x86_64-iwlwifi5100

        path: output/
