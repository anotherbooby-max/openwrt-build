name: Build OpenWrt x86_64 WiFi5100


on:
  workflow_dispatch:


env:

  SOURCE_REPO: https://github.com/coolsnowwolf/lede.git

  # R22 系列稳定提交
  SOURCE_BRANCH: master


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    - name: Checkout build config
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses5-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zlib1g-dev \
          file



    - name: Clone LEDE source
      run: |

        git clone \
          --depth=1 \
          --branch ${SOURCE_BRANCH} \
          ${SOURCE_REPO} \
          lede


        cd lede


        echo "===== SOURCE ====="

        git log -1 --oneline



    - name: Add wireless packages
      run: |

        cd lede


        git clone \
        https://github.com/kenzok8/openwrt-packages.git \
        package/kenzo



    - name: Update feeds
      run: |

        cd lede


        ./scripts/feeds update -a


        ./scripts/feeds install -a



    - name: Load x86_64 config
      run: |

        cd lede


        cp ../configs/x86_64.config .config


        make defconfig



    - name: Verify WiFi driver
      run: |

        cd lede


        grep iwlwifi .config || true

        grep mac80211 .config || true

        grep hostapd .config || true



    - name: Download sources
      run: |

        cd lede

        make download -j8



    - name: Compile
      run: |

        cd lede


        make -j$(nproc) V=s



    - name: Collect firmware
      run: |

        mkdir firmware


        cp -rf \
        lede/bin/targets/x86/64/* \
        firmware/



    - name: Upload firmware
      uses: actions/upload-artifact@v4

      with:

        name: OpenWrt-x86_64-WiFi5100

        path: firmware
