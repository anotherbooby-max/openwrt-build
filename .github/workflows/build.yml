name: Build OpenWrt x86_64 Intel5100

on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

    - name: Checkout build repo
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
        build-essential \
        clang \
        flex \
        bison \
        gawk \
        gettext \
        git \
        libncurses5-dev \
        libssl-dev \
        python3 \
        rsync \
        unzip \
        zlib1g-dev \
        file



    #
    # 固定2021/2022稳定版本
    #
    - name: Clone LEDE R22 source
      run: |

        git clone \
        https://github.com/coolsnowwolf/lede.git \
        lede


        cd lede


        echo "===== TAG LIST ====="

        git tag | grep R22 | tail -10



        echo "===== checkout R22.11.13 ====="


        git checkout \
        R22.11.13



        echo "===== SOURCE VERSION ====="


        git describe --tags


        git log -1 --oneline




    - name: Update feeds
      run: |

        cd lede


        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Load x86_64 config
      run: |

        cd lede


        cp ../configs/x86_64.config \
        .config


        make defconfig



    - name: Verify config
      run: |

        cd lede


        echo "===== WIFI ====="

        grep IWL .config || true

        grep MAC80211 .config || true

        grep WPAD .config || true



    - name: Download sources
      run: |

        cd lede


        make download -j4



    - name: Compile
      run: |

        cd lede


        make V=s -j2



    - name: Check firmware
      run: |

        ls -lh lede/bin/targets/x86/64/


    - name: Collect firmware
      run: |

        mkdir firmware


        cp \
        lede/bin/targets/x86/64/* \
        firmware/



    - name: Upload firmware

      uses: actions/upload-artifact@v4


      with:

        name: openwrt-x8664-intel5100

        path: firmware/
