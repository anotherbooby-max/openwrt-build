name: Build OpenWrt R22.12.1 x86_64 WiFi5100

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

    - name: Checkout build config
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
        build-essential \
        gcc \
        g++ \
        flex \
        bison \
        gawk \
        gettext \
        git \
        libncurses5-dev \
        libssl-dev \
        python3 \
        unzip \
        rsync \
        wget \
        zlib1g-dev \
        file


    #
    # 下载 LEDE R22.12.1
    #
    - name: Clone LEDE R22.12.1 tag
      run: |

        git clone \
        --depth=1 \
        --branch R22.12.1 \
        https://github.com/coolsnowwolf/lede.git \
        lede || {

          echo "tag方式失败,尝试fetch"

          git clone \
          --depth=1 \
          https://github.com/coolsnowwolf/lede.git \
          lede

          cd lede

          git fetch --tags

          git checkout R22.12.1

        }


        cd lede

        echo "===== VERSION ====="

        git describe --tags

        git log -1


    #
    # 添加 kenzok8
    #
    - name: Add kenzok8 packages
      run: |

        cd lede


        git clone \
        https://github.com/kenzok8/openwrt-packages.git \
        package/kenzo


        git clone \
        https://github.com/kenzok8/small.git \
        package/small



    #
    # feeds
    #
    - name: Update feeds
      run: |

        cd lede

        ./scripts/feeds update -a

        ./scripts/feeds install -a



    #
    # 导入配置
    #
    - name: Load x86_64 config
      run: |

        cd lede

        cp ../configs/x86_64.config .config


        make defconfig



    #
    # 检查无线
    #
    - name: Verify wireless config
      run: |

        cd lede


        grep IWLMVM .config || true

        grep IWLWIFI .config || true

        grep MAC80211 .config || true

        grep HOSTAPD .config || true



    #
    # 下载源码
    #
    - name: Download sources
      run: |

        cd lede

        make download -j4



    #
    # 编译
    #
    - name: Compile OpenWrt
      run: |

        cd lede


        make V=s -j2



    #
    # 收集固件
    #
    - name: Upload firmware

      uses: actions/upload-artifact@v4

      with:

        name: openwrt-R22.12.1-x86_64

        path: |

          lede/bin/targets/x86/64/*
