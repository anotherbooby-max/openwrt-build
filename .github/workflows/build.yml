name: Build OpenWrt x86_64 Intel5100

on:
  workflow_dispatch:


permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 360


    steps:


    # =====================
    # Checkout
    # =====================

    - name: Checkout
      uses: actions/checkout@v4



    # =====================
    # Install dependencies
    # =====================

    - name: Install dependencies
      run: |

        sudo apt update


        sudo apt install -y \
          build-essential \
          gcc \
          g++ \
          git \
          make \
          cmake \
          unzip \
          wget \
          curl \
          rsync \
          python3 \
          python3-pip \
          python2 \
          file \
          gawk \
          gettext \
          libncurses5-dev \
          libncursesw5-dev \
          zlib1g-dev \
          libssl-dev \
          patch \
          perl \
          tar \
          bzip2 \
          flex \
          bison \
          gettext-base



        echo "Dependency OK"



    # =====================
    # Clone OpenWrt
    # =====================


    - name: Clone OpenWrt 24.10.5

      run: |


        git clone \
          --depth=1 \
          --branch openwrt-24.10 \
          https://github.com/openwrt/openwrt.git \
          openwrt


        cd openwrt


        git log -1



    # =====================
    # Add feeds
    # =====================


    - name: Update feeds

      run: |

        cd openwrt


        ./scripts/feeds update -a


        ./scripts/feeds install -a



    # =====================
    # Load config
    # =====================


    - name: Load config

      run: |


        cd openwrt


        cp ../configs/x86_64.config .config


        make defconfig



        echo "===== Wireless ====="


        grep -E \
        "CONFIG_PACKAGE_(kmod-iwlwifi|kmod-mac80211|kmod-cfg80211|iwinfo|iw)" \
        .config || true




    # =====================
    # Download
    # =====================


    - name: Download packages

      run: |

        cd openwrt


        make download -j4



    # =====================
    # Build
    # =====================


    - name: Build

      run: |

        cd openwrt


        make -j2 V=s



    # =====================
    # Check output
    # =====================


    - name: Show firmware

      run: |


        cd openwrt


        ls -lh bin/targets/x86/64/





    # =====================
    # Upload artifact
    # =====================


    - name: Upload firmware

      uses: actions/upload-artifact@v4

      with:

        name: openwrt-x86-intel5100

        path:

          openwrt/bin/targets/x86/64/




    # =====================
    # Create Release
    # =====================


    - name: Create Release

      uses: softprops/action-gh-release@v2

      with:

        tag_name: intel5100-build-${{ github.run_number }}

        name: OpenWrt Intel5100 x86_64

        files:

          openwrt/bin/targets/x86/64/*
