name: Build LEDE x86_64 iwlwifi5100

on:
  workflow_dispatch:


env:

  SOURCE_REPO: https://github.com/coolsnowwolf/lede.git

  # 不使用branch/tag
  SOURCE_COMMIT: 9f26e6205


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    - name: Checkout build repo
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gettext \
          git \
          libncurses5-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zlib1g-dev \
          file



    - name: Clone LEDE

      run: |

        git clone \
          ${SOURCE_REPO} \
          lede


        cd lede


        echo "===== checkout commit ====="


        git checkout ${SOURCE_COMMIT}


        echo "===== version ====="

        git log -1



    - name: Add wireless packages

      run: |

        cd lede


        git clone \
        https://github.com/kenzok8/openwrt-packages.git \
        package/kenzo


        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Load x86 config

      run: |

        cd lede


        cp ../configs/x86_64.config .config


        make defconfig



    - name: Download sources

      run: |

        cd lede

        make download -j8



    - name: Compile

      run: |

        cd lede

        make -j$(nproc)



    - name: Collect firmware

      run: |

        mkdir output


        cp -rf \
        lede/bin/targets/x86/64/* \
        output/



    - name: Upload firmware

      uses: actions/upload-artifact@v4

      with:

        name: lede-x86_64-iwlwifi5100

        path: output
