name: Build LEDE x86_64 Intel5100 AP


on:
  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-22.04


    env:

      SOURCE_REPO: https://github.com/coolsnowwolf/lede.git

      # 2022年前后稳定版本
      SOURCE_COMMIT: 9f26e6205



    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Install dependencies

      run: |

        sudo apt update


        sudo apt install -y \
        build-essential \
        clang \
        flex \
        bison \
        g++ \
        gawk \
        gettext \
        git \
        libncurses5-dev \
        libssl-dev \
        python3 \
        unzip \
        zlib1g-dev \
        file



    - name: Clone LEDE


      run: |


        git clone \
        ${SOURCE_REPO} \
        lede


        cd lede


        echo "===== CURRENT ====="

        git log -1 --oneline



        echo "===== CHECKOUT COMMIT ====="


        git checkout ${SOURCE_COMMIT}



        echo "===== VERSION ====="

        git log -1 --oneline





    - name: Add wireless packages


      run: |

        cd lede


        cat >> .config <<EOF


CONFIG_PACKAGE_kmod-iwlwifi=y

CONFIG_PACKAGE_iwlwifi-firmware=y

CONFIG_PACKAGE_iwlwifi-firmware-5000=y


CONFIG_PACKAGE_kmod-mac80211=y

CONFIG_PACKAGE_kmod-cfg80211=y


CONFIG_PACKAGE_hostapd-common=y

CONFIG_PACKAGE_wpad=y


CONFIG_PACKAGE_luci=y


EOF




    - name: Update feeds


      run: |

        cd lede


        ./scripts/feeds update -a


        ./scripts/feeds install -a




    - name: Load config


      run: |


        cd lede


        cp ../configs/x86_64.config .config


        make defconfig





    - name: Download


      run: |


        cd lede


        make download -j4




    - name: Compile


      run: |


        cd lede


        make V=s -j2





    - name: Collect firmware


      run: |


        mkdir output


        cp lede/bin/targets/x86/64/*.img.gz output/ || true


        cp lede/bin/targets/x86/64/*.img output/ || true


        cp lede/bin/targets/x86/64/*.manifest output/ || true


        find lede/bin/targets/x86/64 -type f




    - name: Upload


      uses: actions/upload-artifact@v4


      with:


        name: lede-x86_64-intel5100


        path: output/
