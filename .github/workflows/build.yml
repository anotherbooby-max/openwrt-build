name: Build LEDE x86_64 Intel5100 AP

on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
        build-essential \
        clang \
        flex \
        bison \
        g++ \
        gawk \
        gcc-multilib \
        gettext \
        git \
        libncurses5-dev \
        libssl-dev \
        python2 \
        python3 \
        rsync \
        unzip \
        zlib1g-dev \
        file


    - name: Clone LEDE
      run: |

        git clone \
        --depth=1 \
        -b master \
        https://github.com/coolsnowwolf/lede.git \
        lede



    - name: Update feeds
      run: |

        cd lede

        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Load config
      run: |

        cd lede
        
        cp ../configs/x86_64.config .config

        make defconfig



    - name: Download packages
      run: |

        cd lede

        make download -j8



    - name: Compile
      run: |

        cd lede

        make -j2 V=s



    - name: Show firmware
      run: |

        ls -lh lede/bin/targets/x86/64



    - name: Upload firmware
      uses: actions/upload-artifact@v4

      with:

        name: LEDE-x86_64-Intel5100

        path:

          lede/bin/targets/x86/64/*
