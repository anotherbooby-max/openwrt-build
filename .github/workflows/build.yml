name: OpenWrt x86_64 Build


on:
  workflow_dispatch:


permissions:
  contents: write


env:

  SOURCE_REPO: https://github.com/coolsnowwolf/lede.git

  KENZO_REPO: https://github.com/kenzok8/openwrt-packages.git

  SMALL_REPO: https://github.com/kenzok8/small.git

  TARGET: x86_64



jobs:


  build:


    runs-on: ubuntu-22.04


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3-setuptools \
          rsync \
          unzip \
          zlib1g-dev \
          file



    - name: Clone LEDE source
      run: |

        set -e


        git clone --depth=1 \
          ${SOURCE_REPO} \
          lede


        cd lede


        echo "===== LEDE VERSION ====="

        git log -1


        echo "===== COMMIT ====="

        git rev-parse HEAD



    - name: Add feeds
      run: |

        cd lede


        echo "Add kenzok8 packages"


        git clone --depth=1 \
          ${KENZO_REPO} \
          package/kenzo


        git clone --depth=1 \
          ${SMALL_REPO} \
          package/small



    - name: Update feeds
      run: |

        cd lede


        ./scripts/feeds update -a


        ./scripts/feeds install -a



    - name: Load x86 config
      run: |

        cd lede


        cp ../configs/x86_64.config .config


        make defconfig



    - name: Build firmware
      run: |

        cd lede


        make -j$(nproc)



    - name: Package firmware
      run: |

        mkdir -p output


        cp lede/bin/targets/x86/64/* output/



    - name: Upload firmware
      uses: actions/upload-artifact@v4

      with:

        name: openwrt-x86_64

        path: output/
