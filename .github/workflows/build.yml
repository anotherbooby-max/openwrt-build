name: Build OpenWrt 18.06.9 Intel5100

on:
  workflow_dispatch:

permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 360


    steps:


    # ==========================
    # Checkout
    # ==========================
    - name: Checkout
      uses: actions/checkout@v4



    # ==========================
    # Install dependencies
    # ==========================
    - name: Install dependencies
      run: |

        sudo apt update


        sudo apt install -y \
          build-essential \
          gcc \
          g++ \
          make \
          git \
          wget \
          curl \
          unzip \
          file \
          rsync \
          subversion \
          gettext \
          libncurses5-dev \
          libncursesw5-dev \
          zlib1g-dev \
          libssl-dev \
          python2 \
          python2-dev \
          python3 \
          python3-distutils \
          gawk \
          flex \
          bison \
          patch \
          perl


        echo "========== Python =========="

        python2 --version


        sudo ln -sf /usr/bin/python2 /usr/bin/python


        python --version



    # ==========================
    # Clone OpenWrt
    # ==========================
    - name: Clone OpenWrt 18.06.9
      run: |

        git clone \
        --depth=1 \
        -b openwrt-18.06 \
        https://github.com/openwrt/openwrt.git \
        openwrt


        cd openwrt

        git checkout v18.06.9



    # ==========================
    # Add wireless packages
    # ==========================
    - name: Update feeds
      run: |

        cd openwrt


        ./scripts/feeds update -a


        ./scripts/feeds install -a



    # ==========================
    # Load config
    # ==========================
    - name: Load config
      run: |

        cd openwrt


        cp ../configs/x86_64.config .config


        make defconfig


        echo "====== Wireless ======"

        grep -E \
        "iwlwifi|mac80211|cfg80211|wireless-regdb" \
        .config || true



    # ==========================
    # Download
    # ==========================
    - name: Download
      run: |

        cd openwrt


        make download -j4



    # ==========================
    # Build
    # ==========================
    - name: Build
      run: |

        cd openwrt


        make V=s -j2



    # ==========================
    # Upload
    # ==========================
    - name: Upload firmware
      if: success()
      uses: actions/upload-artifact@v4

      with:

        name: openwrt-18.06.9-x86-64

        path:

          openwrt/bin/targets/x86/64/


        retention-days: 7



    # ==========================
    # Release
    # ==========================
    - name: Create Release

      if: success()

      uses: softprops/action-gh-release@v2

      with:

        tag_name: openwrt-18.06.9-intel5100

        name: OpenWrt 18.06.9 Intel5100 AP

        files:

          openwrt/bin/targets/x86/64/*
