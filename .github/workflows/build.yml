name: Build OpenWrt x86_64 Intel5100 AP

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
        build-essential \
        clang \
        flex \
        bison \
        gawk \
        gettext \
        git \
        libncurses5-dev \
        libssl-dev \
        python3 \
        rsync \
        unzip \
        zlib1g-dev \
        file


    #
    # 使用2022以前稳定源码
    #
    - name: Clone LEDE
      run: |

        git clone \
        https://github.com/coolsnowwolf/lede.git \
        lede


        cd lede


        echo "===== Current source ====="

        git log -1 --oneline


        #
        # R22.11.13附近提交
        #
        git checkout \
        9f26e6205



    - name: Add wireless packages
      run: |

        cd lede


        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Load config
      run: |

        cd lede


        cp ../configs/x86_64.config .config


        make defconfig



    - name: Verify wireless
      run: |

        cd lede


        grep IWL .config || true

        grep MAC80211 .config || true

        grep HOSTAPD .config || true



    - name: Download
      run: |

        cd lede

        make download -j4



    - name: Compile
      run: |

        cd lede

        make V=s -j2



    - name: Collect firmware
      run: |

        mkdir output


        cp -r \
        lede/bin/targets/x86/64/* \
        output/


    - name: Upload firmware

      uses: actions/upload-artifact@v4

      with:

        name: openwrt-x86_64-intel5100

        path: output/
